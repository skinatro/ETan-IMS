{% extends "admin/change_list.html" %}
{% load i18n admin_urls static admin_list %}

{% block object-tools %}
    <div>
        <form id="barcode-form" method="post" action="barcode-scan/" style="margin-bottom: 20px; text-align: right;">
            {% csrf_token %}
            <label for="barcode_input" style="font-weight: bold; margin-right: 10px;">Scan Barcode:</label>
            <input type="text" id="barcode_input" name="barcode" autofocus style="padding: 8px; border: 2px solid #0f3460; border-radius: 4px; font-size: 14px; width: 250px;">
        </form>
    </div>
    <script>
        // Ensure the input field always regains focus if user clicks outside, helpful for hardware scanners
        document.addEventListener('click', function(e) {
            const input = document.getElementById('barcode_input');
            if (e.target !== input && e.target.tagName !== 'A' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
                input.focus();
            }
        });
    </script>
    {{ block.super }}
{% endblock %}
